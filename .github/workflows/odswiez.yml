name: Odśwież dane kalendarza

on:
  schedule:
    - cron: "17 3 1 * *"   # 1. dnia każdego miesiąca, ok. 4:17 czasu polskiego
  workflow_dispatch: {}      # przycisk „Run workflow" do ręcznego odświeżenia
  push:                      # zmiana artykułów (panel) przebudowuje stronę automatycznie
    branches: [main]
    paths:
      - "content/**"

permissions:
  contents: write

concurrency:
  group: odswiez
  cancel-in-progress: false

jobs:
  odswiez:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pyswisseph fonttools brotli
      - name: Dane tranzytów
        if: github.event_name != 'push'
        run: python generate.py
      - run: python build.py
      - run: node build_pages.js
      - name: Zapisz zmiany
        run: |
          git config user.name "kalendarz-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data.json docs
          git diff --cached --quiet || git commit -m "Odświeżone dane i podstrony"
          git pull --rebase --autostash
          git push
