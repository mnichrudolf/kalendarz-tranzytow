name: Odśwież dane kalendarza
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  odswiez:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install pyswisseph fonttools brotli
      - run: python generate.py
      - run: python build.py
      - name: Zapisz zmiany
        run: |
          git config user.name "kalendarz-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json docs/index.html
          git diff --cached --quiet || git commit -m "Odświeżone dane tranzytów"
          git push
